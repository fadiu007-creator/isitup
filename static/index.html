<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uptime Checker</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Uptime Checker</h1>
    <p class="hint">Enter one URL per line (http:// or https://). Up to 20 sites.</p>
    <form id="check-form">
      <textarea id="urls" rows="6" placeholder="https://example.com&#10;https://httpbin.org/status/200"></textarea>
      <button type="submit" id="submit">Check sites</button>
    </form>
    <p id="message" role="alert" class="error" hidden></p>
    <table id="results" hidden>
      <thead>
        <tr><th>URL</th><th>Status</th><th>HTTP</th><th>Time (ms)</th><th>Details</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="/app.js"></script>
</body>
</html>
